<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laras &amp; Bagas — Rustic Scrapbook</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#a65e42;--deep:#6e3b2a;--bg:#efe2d0;--paper:#f9f1e5;--ink:#3d2b24;--muted:#735f52;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
img{display:block;width:100%}
/* ===== Cover: memudar-zoom, SATU polaroid miring + washi tape (sama seperti demo) ===== */
#cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:56px 28px;text-align:center;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;transition:transform .9s ease,opacity .9s ease}
#cover::-webkit-scrollbar{display:none}
#cover::before{content:"";position:absolute;inset:22px;border:1px dashed var(--accent);pointer-events:none;z-index:1}
#cover.gone{transform:scale(1.07);opacity:0}
.cover-bg{position:absolute;inset:0}
.cover-bg img{height:100%;object-fit:cover;filter:brightness(.38) saturate(.8);transform:scale(1.04)}
.content{position:relative;z-index:2;color:#fff;margin:auto}
.small{font:600 .72rem/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.frame{display:flex;gap:0;background:transparent;padding:8px 4px 12px;width:fit-content;max-width:100%;margin:0 auto 18px;position:relative;animation:floaty 5s ease-in-out infinite}
.frame::before{content:"";position:absolute;top:-6px;left:15%;width:86px;height:25px;background:rgba(226,207,163,.92);transform:rotate(-7deg);z-index:3;box-shadow:0 2px 5px rgba(62,38,20,.2)}
.frame::after{content:"";position:absolute;top:-2px;right:12%;width:86px;height:25px;background:rgba(226,207,163,.92);transform:rotate(6deg);z-index:3;box-shadow:0 2px 5px rgba(62,38,20,.2)}
.frame img{width:min(31vw,128px);aspect-ratio:3/4;object-fit:cover;background:#fffdf8;padding:7px 7px 24px;border:1px solid rgba(110,59,42,.18);border-radius:2px;box-shadow:0 14px 28px rgba(0,0,0,.45)}
.frame img{transform:rotate(-5deg)}
.stamp{position:absolute;top:92px;right:26px;width:92px;height:92px;border:2px dashed rgba(255,240,220,.75);border-radius:50%;display:grid;place-items:center;text-align:center;font:700 .56rem var(--sans);letter-spacing:.16em;line-height:1.8;color:rgba(255,240,220,.85);transform:rotate(-12deg);z-index:3;pointer-events:none}
.names{font:600 clamp(3.4rem,13vw,5.7rem)/.86 var(--serif);letter-spacing:-.04em;margin:0 0 8px}
.date{margin:22px 0 4px;font:600 .85rem/1.4 var(--sans);letter-spacing:.14em}
.to{background:#fffdf6;color:#2b2924;padding:14px 26px 16px;border:2px dashed var(--accent);outline:8px solid rgba(255,253,246,.94);outline-offset:-2px;margin:20px auto 22px;max-width:330px;box-shadow:0 14px 28px rgba(0,0,0,.35);position:relative}
.to::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;background:rgba(226,207,163,.92);transform:translateX(-50%) rotate(-2.5deg)}
.to span{font:600 .65rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#8a7a5f}
.to b{display:block;font:italic 600 1.3rem var(--serif);margin-top:2px}
.open{min-width:180px;border:1px solid rgba(255,255,255,.75);padding:13px 20px;background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(5px);font:700 .95rem var(--sans);cursor:pointer}
.float-ico{position:absolute;z-index:3;font-size:1.8rem;color:#ffd9a8;text-shadow:0 2px 10px rgba(0,0,0,.4);animation:floaty 4s ease-in-out infinite;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
/* ===== Section pembuka di balik cover ===== */
.sec{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:64px 26px;background-image:repeating-linear-gradient(0deg,rgba(122,84,50,.08) 0 2px,transparent 2px 6px),repeating-linear-gradient(90deg,rgba(122,84,50,.08) 0 2px,transparent 2px 6px),linear-gradient(180deg,#f3e7d0,#ecdabd)}
.ribbon{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--accent);font-size:1.15rem}
.ribbon::before,.ribbon::after{content:"";width:62px;border-top:2px dashed currentColor}
.sec .kick{font:600 .72rem var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.sec h3{font:600 clamp(2.8rem,11vw,3.4rem)/1 var(--serif)}
.sec p{max-width:410px;color:var(--muted);line-height:1.65}
.hint{display:inline-block;margin-top:10px;font:600 .68rem var(--sans);letter-spacing:.3em;background:rgba(0,0,0,.06);padding:8px 18px;border-radius:20px;color:var(--ink)}
.brand{margin-top:26px;font:600 1.05rem var(--serif);color:var(--deep)}
.sec-ico{width:52px;height:52px;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:50%;background:var(--paper);color:var(--accent);transform:rotate(-4deg);box-shadow:0 8px 18px rgba(62,38,20,.18)}
.sec-ico svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec-meta{display:flex;gap:18px;justify-content:center;font:600 .8rem var(--sans);color:var(--muted)}
.sec-meta span{display:inline-flex;align-items:center;gap:6px}
.sec-meta svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand-note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.frame,.float-ico{animation:none}}
</style>
</head>
<body>
<section class="sec">
  <div class="ribbon">❀</div>
  <div class="sec-ico"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l4.2 5.2L24 14.4 19.8 9.2 24 4z"/><circle cx="17.5" cy="30" r="10.5"/><circle cx="30.5" cy="30" r="10.5"/></svg></div>
  <p class="kick">The Wedding of</p>
  <h3>Laras<br>&amp; Bagas</h3>
  <p><b>Sabtu, 12 Desember 2026</b><br>Gedung Serbaguna<br>Bandung</p>
  <div class="sec-meta"><span><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="10" width="34" height="31" rx="3"/><path d="M7 19.5h34M15.5 5v8M32.5 5v8M15 27h4M22.5 27h4M30 27h4M15 34h4M22.5 34h4"/></svg>12 · 12 · 2026</span><span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 43.5S10.5 30 10.5 19.8A13.5 13.5 0 0 1 37.5 19.8C37.5 30 24 43.5 24 43.5z"/><circle cx="24" cy="19.8" r="4.8"/></svg>Bandung</span></div>
  <span class="hint">GESER KE BAWAH ⌄</span>
  <div class="brand">Kabar<i>Bahagia</i></div>
  <p class="brand-note">Dibuat dengan ♥ oleh KabarBahagia</p>
</section>
<div id="cover">
  <span class="float-ico" style="top:9%;left:8%">❀</span>
  <span class="float-ico" style="top:13%;right:9%;animation-delay:.8s">✿</span>
  <span class="float-ico" style="bottom:9%;right:8%;animation-delay:1.4s">❀</span>
  <span class="float-ico" style="bottom:11%;left:9%;animation-delay:.4s">✿</span>
  <span class="stamp">POS · BANDUNG<br>12·12·2026</span>
  <div class="cover-bg"><img src="pasangan-hero.jpg" alt="Latar foto model pasangan pengantin tema Rustic Scrapbook"></div>
  <div class="content">
    <div class="small">The wedding of</div>
    <div class="frame"><img src="pasangan-hero.jpg" alt="Foto model pasangan pengantin berpelukan di taman bunga"></div>
    <h2 class="names">Laras<br>&amp; Bagas</h2>
    <div class="date">12 · 12 · 2026</div>
    <div class="to"><span>Kepada Yth:</span><b>Bapak/Ibu/Saudara/i</b></div>
    <button class="open" id="openBtn" type="button">Buka Undangan</button>
  </div>
</div>
<script>
document.getElementById('openBtn').addEventListener('click', function () {
  var c = document.getElementById('cover');
  c.classList.add('gone');
  setTimeout(function () { c.style.display = 'none'; document.body.style.overflow = 'auto'; }, 950);
});
</script>
</body>
</html>
